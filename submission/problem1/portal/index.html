<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Fleet Portal</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
header{padding:14px 20px;background:#172033;color:#fff;display:flex;justify-content:space-between;align-items:center}
main{display:grid;grid-template-columns:1.4fr .8fr;gap:14px;padding:14px}
section{background:#fff;border:1px solid #d9e0ec;border-radius:8px;padding:12px}
canvas{width:100%;height:400px;border:1px solid #cbd5e1;background:#eef3f8}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid #e5e9f0;padding:6px;text-align:left}
button{border:0;border-radius:6px;background:#1f6feb;color:#fff;padding:8px 12px;cursor:pointer}
@media(max-width:850px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><strong>Drone Fleet Portal</strong><button id="tick">Advance 30s</button></header>
<main>
<section><canvas id="map" width="900" height="520"></canvas></section>
<div>
<section><h2>Drones</h2><table id="drones"></table></section>
<section><h2>Charging Pads</h2><table id="pads"></table></section>
<section><h2>Requests</h2><table id="requests"></table></section>
</div>
</main>
<script>
const api='http://127.0.0.1:8080',canvas=document.getElementById('map'),ctx=canvas.getContext('2d');
const color=d=>d.soc_pct<20?'#c1121f':d.status==='In-Flight'?'#1f6feb':'#18864b';
function draw(s){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#172033';ctx.beginPath();ctx.arc(canvas.width/2,canvas.height/2,8,0,7);ctx.fill();ctx.fillText('Base',canvas.width/2+12,canvas.height/2+4);
s.drones.forEach(d=>{const x=canvas.width/2+d.position[0]/8,y=canvas.height/2-d.position[1]/8;ctx.fillStyle=color(d);ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();ctx.fillText(d.id,x+9,y+4);});}
function table(id,heads,rows){document.getElementById(id).innerHTML='<tr>'+heads.map(h=>`<th>${h}</th>`).join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(c=>`<td>${c??''}</td>`).join('')+'</tr>').join('');}
async function refresh(){const s=await(await fetch(`${api}/state`)).json();draw(s);
table('drones',['ID','Status','SoC','SoH','Job'],s.drones.map(d=>[d.id,d.status,d.soc_pct+'%',d.soh_pct+'%',d.active_request]));
table('pads',['Pad','Occupied','Reserved','Free At'],s.pads.map(p=>[p.id,p.occupied_by,p.reserved_by,p.available_at]));
table('requests',['ID','Status','Drone','Reason'],s.requests.map(r=>[r.id,r.status,r.assigned_drone,r.reason]));}
document.getElementById('tick').onclick=async()=>{await fetch(`${api}/tick`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dt_s:30})});refresh();};
refresh();setInterval(refresh,2000);
</script>
</body>
</html>
