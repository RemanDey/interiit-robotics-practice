<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drone Fleet Portal</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f7fb; color: #172033; }
    header { padding: 16px 24px; background: #172033; color: white; display: flex; justify-content: space-between; align-items: center; }
    main { display: grid; grid-template-columns: minmax(320px, 1.4fr) minmax(280px, .8fr); gap: 16px; padding: 16px; }
    section { background: white; border: 1px solid #d9e0ec; border-radius: 8px; padding: 14px; }
    canvas { width: 100%; height: 420px; border: 1px solid #cbd5e1; background: #eef3f8; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border-bottom: 1px solid #e5e9f0; padding: 7px; text-align: left; }
    .grid { display: grid; gap: 16px; }
    .alert { color: #b42318; font-weight: 700; }
    button { border: 0; border-radius: 6px; background: #1f6feb; color: white; padding: 9px 12px; cursor: pointer; }
    @media (max-width: 850px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <strong>Drone Fleet Portal</strong>
    <button id="tick">Advance 30s</button>
  </header>
  <main>
    <section>
      <canvas id="map" width="900" height="520"></canvas>
    </section>
    <div class="grid">
      <section>
        <h2>Drones</h2>
        <table id="drones"></table>
      </section>
      <section>
        <h2>Charging Pads</h2>
        <table id="pads"></table>
      </section>
      <section>
        <h2>Requests</h2>
        <table id="requests"></table>
      </section>
    </div>
  </main>
  <script>
    const api = 'http://127.0.0.1:8080';
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');

    function draw(state) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#172033';
      ctx.beginPath();
      ctx.arc(canvas.width / 2, canvas.height / 2, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillText('Base', canvas.width / 2 + 12, canvas.height / 2 + 4);
      state.drones.forEach(drone => {
        const x = canvas.width / 2 + drone.position[0] / 8;
        const y = canvas.height / 2 - drone.position[1] / 8;
        ctx.fillStyle = drone.soc_pct < 20 ? '#c1121f' : drone.status === 'In-Flight' ? '#1f6feb' : '#18864b';
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillText(drone.id, x + 9, y + 4);
      });
    }

    function table(id, headers, rows) {
      document.getElementById(id).innerHTML = '<tr>' + headers.map(h => `<th>${h}</th>`).join('') + '</tr>' +
        rows.map(row => '<tr>' + row.map(cell => `<td>${cell ?? ''}</td>`).join('') + '</tr>').join('');
    }

    async function refresh() {
      const response = await fetch(`${api}/state`);
      const state = await response.json();
      draw(state);
      table('drones', ['ID', 'Status', 'SoC', 'SoH', 'Job'], state.drones.map(d => [d.id, d.status, d.soc_pct + '%', d.soh_pct + '%', d.active_request]));
      table('pads', ['Pad', 'Occupied', 'Reserved', 'Free At'], state.pads.map(p => [p.id, p.occupied_by, p.reserved_by, p.available_at]));
      table('requests', ['ID', 'Status', 'Drone', 'Reason'], state.requests.map(r => [r.id, r.status, r.assigned_drone, r.reason]));
    }

    document.getElementById('tick').onclick = async () => {
      await fetch(`${api}/tick`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({dt_s: 30}) });
      refresh();
    };
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
